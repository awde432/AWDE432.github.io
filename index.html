<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViMoxPC — 站点维护中</title>
<meta name="description" content="ViMoxPC 官方网站正在更新，页面与下载通道暂时关闭，恢复后将在此页开放。">
<meta name="theme-color" content="#0078D4">
<link rel="icon" href="/assets/vimoxPC.ico" type="image/x-icon">
<style>
  :root{
    --brand:#0078D4;
    --brand-dark:#005A9E;
    --ink-900:#14181F;
    --ink-600:#4A5462;
    --ink-400:#8A94A2;
    --line:#E3E8EF;
    --bg:#FFFFFF;
    --soft:#F5F8FC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden}
  body{overflow-x:hidden}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--bg);color:var(--ink-900);
    min-height:100vh;display:flex;flex-direction:column;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:720px;margin:0 auto;padding:0 20px}
  p,li,span,a{word-break:break-word}
  header{padding:28px 0 0}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-900)}
  .brand img{width:26px;height:26px;display:block}
  .brand span{font-weight:650;font-size:17px;letter-spacing:.2px}
  .brand em{font-style:normal;color:var(--brand)}
  main{flex:1;display:flex;align-items:center;padding:56px 0 40px}
  .card{
    background:var(--bg);border:1px solid var(--line);border-radius:16px;
    padding:44px 40px;box-shadow:0 1px 2px rgba(20,24,31,.04),0 12px 32px rgba(20,24,31,.05);
    width:100%;
  }
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--brand);background:var(--soft);border:1px solid #D6E6F7;
    border-radius:999px;padding:5px 12px;margin-bottom:22px;
  }
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--brand);display:block;
    box-shadow:0 0 0 3px rgba(0,120,212,.14)}
  h1{font-size:clamp(21px,7vw,31px);line-height:1.32;letter-spacing:-.3px;font-weight:680;margin-bottom:16px;word-break:break-word}
  h1 em{font-style:normal;color:var(--brand)}
  p.lead{color:var(--ink-600);font-size:15.5px;margin-bottom:10px}
  p.lead + p.lead{margin-bottom:0}
  ul{list-style:none;margin:26px 0 0;border-top:1px solid var(--line)}
  ul li{
    display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);
    font-size:14.5px;color:var(--ink-600);
  }
  ul li b{color:var(--ink-900);font-weight:600;min-width:92px;flex:none}
  .meta{margin-top:26px;font-size:13px;color:var(--ink-400)}
  footer{padding:0 0 34px;font-size:13px;color:var(--ink-400)}
  footer a{color:var(--ink-600);text-decoration:none;border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--brand);border-color:var(--brand)}
  @media (max-width:560px){
    .card{padding:32px 22px;border-radius:14px}
    h1{font-size:25px}
    main{padding:34px 0 26px}
    ul li{flex-direction:column;gap:2px}
    ul li b{min-width:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/" aria-label="ViMoxPC">
      <img src="/assets/vimoxPC.ico" alt="">
      <span>Vi<em>Mox</em>PC</span>
    </a>
  </header>

  <main>
    <div class="card">
      <div class="tag"><i></i>维护中</div>
      <h1>本站正在<em>更新维护</em>，页面暂时关闭</h1>
      <p class="lead">ViMoxPC 官方站正在进行内容更新，页面的展示与下载通道已暂时关闭，避免各位拿到过期信息。</p>
      <p class="lead">网址不会变，恢复后直接访问本站即可，无需收藏新链接。</p>

      <ul>
        <li><b>当前状态</b><span>站点维护中，可访问但暂停服务</span></li>
        <li><b>受影响范围</b><span>介绍页面、下载入口、版本说明</span></li>
        <li><b>不受影响</b><span>GitHub 仓库与历史发布记录保持不变</span></li>
      </ul>

      <p class="meta">页面状态更新于 2026-11-16</p>
    </div>
  </main>

  <footer>
    <div class="wrap" style="padding:0">
      如需了解项目进展，可查看 <a href="https://github.com/awde432/AWDE432.github.io">GitHub 仓库</a>。
    </div>
  </footer>
</div>
</body>
</html>
