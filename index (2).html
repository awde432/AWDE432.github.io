<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矩证工作室 - 反馈中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FormSubmit 无需SDK，纯表单提交 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a25;
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.4);
            --border: rgba(255,255,255,0.1);
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 开场动画 */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-content {
            text-align: center;
            animation: introPulse 2s ease-in-out infinite;
        }

        @keyframes introPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

        .intro-title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: introTitleSlide 0.8s ease;
        }

        @keyframes introTitleSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .intro-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            animation: introSubtitleSlide 0.8s ease 0.2s both;
        }

        @keyframes introSubtitleSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .intro-loading {
            display: flex;
            justify-content: center;
            gap: 12px;
            animation: introLoadingSlide 0.8s ease 0.4s both;
        }

        @keyframes introLoadingSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .intro-dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            animation: introDotBounce 1.4s ease-in-out infinite;
        }

        .intro-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .intro-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes introDotBounce {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* 文字动画遮罩 */
        .text-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .text-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .text-overlay-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .text-animation-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }

        .animated-text {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 20px 0;
            opacity: 0;
            transform: translateY(20px);
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            letter-spacing: 2px;
        }

        /* 文字动画 - 淡入淡出效果 */
        @keyframes textFadeInOut {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            20% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            70% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            90% {
                opacity: 0;
                transform: translateY(-10px) scale(0.95);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
        }

        .animated-text.show {
            animation: textFadeInOut 3s ease-in-out forwards;
        }

        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* 成功提示卡牌 */
        .success-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            background: rgba(0, 0, 0, 0.6);
        }

        .success-card-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .success-card {
            width: 320px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-180deg) scale(0.5);
            opacity: 0;
        }

        .success-card-overlay.show .success-card {
            animation: cardFlipIn 0.6s ease forwards;
        }

        @keyframes cardFlipIn {
            0% {
                transform: rotateY(-180deg) scale(0.5);
                opacity: 0;
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }

        .success-card.closing {
            animation: cardFlipOut 0.6s ease forwards;
        }

        @keyframes cardFlipOut {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: rotateY(180deg) scale(0);
                opacity: 0;
            }
        }

        .success-card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9) 0%, rgba(5, 150, 105, 0.95) 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(16, 185, 129, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 15px;
            animation: successIconPulse 1s ease-in-out infinite;
        }

        @keyframes successIconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .success-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 0 20px;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            animation: particleFloat 15s infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 40px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px 60px;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* 表单卡片 */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            animation: fadeInUp 0.8s ease 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .step.active {
            color: var(--primary);
        }

        .step.completed {
            color: var(--success);
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .step.active .step-number {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .step.completed .step-number {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        /* 表单组 */
        .form-group {
            margin-bottom: 28px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .form-label .required {
            color: var(--error);
            margin-left: 4px;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* 输入框 */
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-muted);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* 选项按钮组 */
        .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .option-btn {
            padding: 16px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-color: var(--primary);
            color: var(--text-primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .option-btn.selected::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 10px;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        /* 单选按钮组 */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .radio-item {
            flex: 1;
            min-width: 200px;
        }

        .radio-input {
            display: none;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-label:hover {
            border-color: var(--primary);
        }

        .radio-input:checked + .radio-label {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-color: var(--primary);
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .radio-input:checked + .radio-label .radio-circle {
            border-color: var(--primary);
            background: var(--primary);
        }

        .radio-circle::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s;
        }

        .radio-input:checked + .radio-label .radio-circle::after {
            transform: scale(1);
        }

        .radio-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .radio-input:checked + .radio-label .radio-text {
            color: var(--text-primary);
        }

        /* 动态显示区域 */
        .dynamic-section {
            display: none;
            animation: slideDown 0.4s ease;
        }

        .dynamic-section.visible {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 字符计数 */
        .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .char-count.warning {
            color: var(--error);
        }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        /* 加载动画 */
        .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .submit-btn.loading .btn-loader {
            display: inline-block;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 成功/错误提示 */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            animation: shake 0.5s ease;
        }

        .alert.visible {
            display: block;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            position: relative;
            z-index: 10;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

            .container {
                padding: 100px 15px 40px;
            }

            .header h1 {
                font-size: 28px;
            }

            .form-card {
                padding: 24px;
            }

            .option-group {
                grid-template-columns: 1fr;
            }

            .radio-item {
                min-width: 100%;
            }
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 32px 0;
        }

    </style>
</head>
<body>
    <!-- 开场动画 -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-content">
            <h2 class="intro-title">矩证工作室</h2>
            <p class="intro-subtitle">反馈中心</p>
            <div class="intro-loading">
                <div class="intro-dot"></div>
                <div class="intro-dot"></div>
                <div class="intro-dot"></div>
            </div>
        </div>
    </div>

    <!-- 文字动画遮罩 -->
    <div class="text-overlay" id="textOverlay">
        <div class="text-overlay-bg"></div>
        <div class="text-animation-container">
            <p class="animated-text" id="text1">工作室制作的东西难免会出现问题</p>
            <p class="animated-text" id="text2">你可以在这里进行反馈</p>
            <p class="animated-text" id="text3">如果出现任何问题，我们都可以解决</p>
            <p class="animated-text" id="text4">让我想想你要反馈什么？你可以填写以下表格</p>
        </div>
    </div>

    <!-- 背景动画 -->
    <div class="bg-animation"></div>
    
    <!-- 粒子效果 -->
    <div class="particles" id="particles"></div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>矩证工作室反馈中心</h1>
            <p>您的反馈对我们至关重要，帮助我们不断改进产品体验</p>
        </div>

        <!-- 表单卡片 -->
        <div class="form-card">
            <!-- 提示消息 -->
            <div class="alert" id="alertBox"></div>

            <!-- 成功提示卡牌 -->
            <div class="success-card-overlay" id="successCardOverlay">
                <div class="success-card" id="successCard">
                    <div class="success-card-front">
                        <div class="success-icon">✓</div>
                        <h3 class="success-title">反馈成功</h3>
                        <p class="success-message">我们将会通知我们的工作人员</p>
                    </div>
                </div>
            </div>

            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <span>基本信息</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <span>问题详情</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <span>提交反馈</span>
                </div>
            </div>

            <form id="feedbackForm">
                <!-- 问题1: 反馈类型 -->
                <div class="form-group">
                    <label class="form-label">选择问题反馈类型 <span class="required">*</span></label>
                    <div class="option-group">
                        <button type="button" class="option-btn" data-value="webpage" data-target="feedbackType">网页反馈</button>
                        <button type="button" class="option-btn" data-value="software" data-target="feedbackType">软件反馈</button>
                        <button type="button" class="option-btn" data-value="other" data-target="feedbackType">其他反馈</button>
                    </div>
                    <input type="hidden" name="feedback_type" id="feedbackType" required>
                    
                    <!-- 其他反馈输入框 -->
                    <div class="dynamic-section" id="otherFeedbackSection">
                        <input type="text" class="form-input" name="other_feedback_type" id="otherFeedbackInput" 
                               placeholder="请输入反馈类型（最多10个字符）" maxlength="10">
                        <div class="char-count"><span id="otherFeedbackCount">0</span>/10</div>
                    </div>
                </div>

                <!-- 问题2: 名称 -->
                <div class="form-group">
                    <label class="form-label">该问题的网页或软件叫做什么？ <span class="required">*</span></label>
                    <input type="text" class="form-input" name="product_name" id="productName" 
                           placeholder="请输入产品名称" maxlength="20" required>
                    <div class="char-count"><span id="productNameCount">0</span>/20</div>
                    <p class="form-hint">这有助于我们更好地定位和修复问题</p>
                </div>

                <!-- 问题3: 网址（仅网页反馈显示） -->
                <div class="form-group dynamic-section" id="urlSection">
                    <label class="form-label">请输入你要反馈的网页网址 <span class="required">*</span></label>
                    <input type="url" class="form-input" name="webpage_url" id="webpageUrl" 
                           placeholder="https://example.com">
                </div>

                <div class="divider"></div>

                <!-- 问题4: 产品来源 -->
                <div class="form-group">
                    <label class="form-label">请确认你要反馈的产品来源 <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" class="radio-input" name="product_source" id="sourceOfficial" value="official" required>
                            <label class="radio-label" for="sourceOfficial">
                                <span class="radio-circle"></span>
                                <span class="radio-text">我已知晓，确定为官方产品</span>
                            </label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" class="radio-input" name="product_source" id="sourceThirdParty" value="thirdparty">
                            <label class="radio-label" for="sourceThirdParty">
                                <span class="radio-circle"></span>
                                <span class="radio-text">第三方部署，非官方产品</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 官方产品的问题组 -->
                <div class="dynamic-section" id="officialQuestions">
                    <!-- 地区 -->
                    <div class="form-group">
                        <label class="form-label">你所在的地区 <span class="required">*</span></label>
                        <select class="form-select" name="region" id="region">
                            <option value="">请选择地区</option>
                            <option value="china">中国大陆</option>
                            <option value="hongkong">中国香港</option>
                            <option value="taiwan">中国台湾</option>
                            <option value="macau">中国澳门</option>
                            <option value="usa">美国</option>
                            <option value="canada">加拿大</option>
                            <option value="uk">英国</option>
                            <option value="australia">澳大利亚</option>
                            <option value="japan">日本</option>
                            <option value="korea">韩国</option>
                            <option value="singapore">新加坡</option>
                            <option value="germany">德国</option>
                            <option value="france">法国</option>
                            <option value="other">其他地区</option>
                        </select>
                    </div>

                    <!-- 问题类型 -->
                    <div class="form-group">
                        <label class="form-label">反馈问题的类型 <span class="required">*</span></label>
                        <div class="option-group">
                            <button type="button" class="option-btn" data-value="crash" data-target="issueType">异常崩溃及报错</button>
                            <button type="button" class="option-btn" data-value="function" data-target="issueType">按钮或功能不可用</button>
                            <button type="button" class="option-btn" data-value="loading" data-target="issueType">长时间等待</button>
                            <button type="button" class="option-btn" data-value="unavailable" data-target="issueType">部分地区/时间不可用</button>
                            <button type="button" class="option-btn" data-value="other" data-target="issueType">其他</button>
                        </div>
                        <input type="hidden" name="issue_type" id="issueType">
                        
                        <!-- 其他问题类型输入 -->
                        <div class="dynamic-section" id="otherIssueSection">
                            <input type="text" class="form-input" name="other_issue_type" id="otherIssueInput" 
                                   placeholder="请描述问题类型（最多30个字符）" maxlength="30">
                            <div class="char-count"><span id="otherIssueCount">0</span>/30</div>
                        </div>
                    </div>
                </div>

                <!-- 第三方产品的问题组 -->
                <div class="dynamic-section" id="thirdPartyQuestions">
                    <!-- 获取来源 -->
                    <div class="form-group">
                        <label class="form-label">请问你是在哪里获取的我们的产品？ <span class="required">*</span></label>
                        <div class="option-group">
                            <button type="button" class="option-btn" data-value="baidu" data-target="sourceType">百度网盘</button>
                            <button type="button" class="option-btn" data-value="shared" data-target="sourceType">其他人分享</button>
                            <button type="button" class="option-btn" data-value="other_cloud" data-target="sourceType">其他网盘</button>
                            <button type="button" class="option-btn" data-value="unofficial_site" data-target="sourceType">非官网网站</button>
                            <button type="button" class="option-btn" data-value="other" data-target="sourceType">其他</button>
                        </div>
                        <input type="hidden" name="source_type" id="sourceType">
                        
                        <!-- 其他来源输入 -->
                        <div class="dynamic-section" id="otherSourceSection">
                            <input type="text" class="form-input" name="other_source" id="otherSourceInput" 
                                   placeholder="请说明获取来源（最多40个字符）" maxlength="40">
                            <div class="char-count"><span id="otherSourceCount">0</span>/40</div>
                        </div>
                    </div>
                </div>

                <!-- 问题描述（共用） -->
                <div class="form-group">
                    <label class="form-label">请详细描述具体问题 <span class="required">*</span></label>
                    <textarea class="form-textarea" name="description" id="description" 
                              placeholder="请尽可能详细地描述你遇到的问题，包括：
• 问题发生的具体步骤
• 期望的结果是什么
• 实际看到的结果是什么
• 是否尝试过刷新页面或重启软件" required></textarea>
                </div>

                <!-- 联系方式 -->
                <div class="form-group">
                    <label class="form-label">是否接受我们以QQ或其他形式与你取得联系？ <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" class="radio-input" name="contact_accept" id="contactYes" value="yes" required>
                            <label class="radio-label" for="contactYes">
                                <span class="radio-circle"></span>
                                <span class="radio-text">OK，可以联系我</span>
                            </label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" class="radio-input" name="contact_accept" id="contactNo" value="no">
                            <label class="radio-label" for="contactNo">
                                <span class="radio-circle"></span>
                                <span class="radio-text">No，暂时不需要</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 联系信息（选择OK时显示） -->
                <div class="dynamic-section" id="contactInfoSection">
                    <div class="form-group">
                        <label class="form-label">请输入您的QQ号或邮箱 <span class="required">*</span></label>
                        <input type="text" class="form-input" name="contact_info" id="contactInfo" 
                               placeholder="QQ号或邮箱地址">
                    </div>
                </div>

                <!-- 提交按钮 -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-loader"></span>
                    <span class="btn-text">提交反馈</span>
                </button>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2024 矩证工作室. 保留所有权利.</p>
    </footer>

    <script>
        // ==================== 粒子效果 ====================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // ==================== 选项按钮交互 ====================
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.dataset.target;
                const value = this.dataset.value;
                
                // 同组按钮取消选中
                document.querySelectorAll(`.option-btn[data-target="${target}"]`).forEach(b => {
                    b.classList.remove('selected');
                });
                
                // 选中当前按钮
                this.classList.add('selected');
                
                // 设置隐藏input的值
                document.getElementById(target).value = value;
                
                // 触发相应逻辑
                handleOptionChange(target, value);
            });
        });

        // ==================== 单选按钮交互 ====================
        document.querySelectorAll('.radio-input').forEach(radio => {
            radio.addEventListener('change', function() {
                handleRadioChange(this.name, this.value);
            });
        });

        // ==================== 处理选项变化 ====================
        function handleOptionChange(target, value) {
            // 反馈类型选择
            if (target === 'feedbackType') {
                const otherSection = document.getElementById('otherFeedbackSection');
                const urlSection = document.getElementById('urlSection');
                
                if (value === 'other') {
                    otherSection.classList.add('visible');
                    document.getElementById('otherFeedbackInput').required = true;
                } else {
                    otherSection.classList.remove('visible');
                    document.getElementById('otherFeedbackInput').required = false;
                }
                
                if (value === 'webpage') {
                    urlSection.classList.add('visible');
                    document.getElementById('webpageUrl').required = true;
                } else {
                    urlSection.classList.remove('visible');
                    document.getElementById('webpageUrl').required = false;
                }
                
                updateStepIndicator(1);
            }
            
            // 问题类型选择
            if (target === 'issueType') {
                const otherSection = document.getElementById('otherIssueSection');
                if (value === 'other') {
                    otherSection.classList.add('visible');
                    document.getElementById('otherIssueInput').required = true;
                } else {
                    otherSection.classList.remove('visible');
                    document.getElementById('otherIssueInput').required = false;
                }
            }
            
            // 获取来源选择
            if (target === 'sourceType') {
                const otherSection = document.getElementById('otherSourceSection');
                if (value === 'other') {
                    otherSection.classList.add('visible');
                    document.getElementById('otherSourceInput').required = true;
                } else {
                    otherSection.classList.remove('visible');
                    document.getElementById('otherSourceInput').required = false;
                }
            }
        }

        // ==================== 处理单选变化 ====================
        function handleRadioChange(name, value) {
            if (name === 'product_source') {
                const officialQuestions = document.getElementById('officialQuestions');
                const thirdPartyQuestions = document.getElementById('thirdPartyQuestions');
                
                if (value === 'official') {
                    officialQuestions.classList.add('visible');
                    thirdPartyQuestions.classList.remove('visible');
                    
                    // 设置必填
                    document.getElementById('region').required = true;
                    document.getElementById('issueType').required = true;
                    document.getElementById('sourceType').required = false;
                } else {
                    officialQuestions.classList.remove('visible');
                    thirdPartyQuestions.classList.add('visible');
                    
                    // 设置必填
                    document.getElementById('region').required = false;
                    document.getElementById('issueType').required = false;
                    document.getElementById('sourceType').required = true;
                }
                
                updateStepIndicator(2);
            }
            
            if (name === 'contact_accept') {
                const contactSection = document.getElementById('contactInfoSection');
                if (value === 'yes') {
                    contactSection.classList.add('visible');
                    document.getElementById('contactInfo').required = true;
                } else {
                    contactSection.classList.remove('visible');
                    document.getElementById('contactInfo').required = false;
                }
            }
        }

        // ==================== 更新步骤指示器 ====================
        function updateStepIndicator(step) {
            document.querySelectorAll('.step').forEach((s, index) => {
                s.classList.remove('active', 'completed');
                if (index < step) {
                    s.classList.add('completed');
                } else if (index === step) {
                    s.classList.add('active');
                }
            });
        }

        // ==================== 字符计数 ====================
        function setupCharCount(inputId, countId, max) {
            const input = document.getElementById(inputId);
            const count = document.getElementById(countId);
            
            input.addEventListener('input', function() {
                const len = this.value.length;
                count.textContent = len;
                
                if (len >= max) {
                    count.parentElement.classList.add('warning');
                } else {
                    count.parentElement.classList.remove('warning');
                }
            });
        }

        setupCharCount('otherFeedbackInput', 'otherFeedbackCount', 10);
        setupCharCount('productName', 'productNameCount', 20);
        setupCharCount('otherIssueInput', 'otherIssueCount', 30);
        setupCharCount('otherSourceInput', 'otherSourceCount', 40);

        // ==================== 显示提示消息 ====================
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = 'alert ' + type + ' visible';
            
            setTimeout(() => {
                alertBox.classList.remove('visible');
            }, 5000);
        }

        // ==================== 表单提交 ====================
        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            
            // 验证必填项
            const feedbackType = document.getElementById('feedbackType').value;
            if (!feedbackType) {
                showAlert('请选择反馈类型', 'error');
                return;
            }
            
            const productSource = document.querySelector('input[name="product_source"]:checked');
            if (!productSource) {
                showAlert('请确认产品来源', 'error');
                return;
            }
            
            // 根据产品来源验证
            if (productSource.value === 'official') {
                const region = document.getElementById('region').value;
                const issueType = document.getElementById('issueType').value;
                if (!region || !issueType) {
                    showAlert('请填写完整的问题信息', 'error');
                    return;
                }
            } else {
                const sourceType = document.getElementById('sourceType').value;
                if (!sourceType) {
                    showAlert('请选择获取来源', 'error');
                    return;
                }
            }
            
            // 显示加载状态
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            
            // 收集表单数据
            const formData = new FormData(this);
            
            // 添加时间戳
            formData.append('submit_time', new Date().toLocaleString('zh-CN'));
            
            // 添加邮件主题
            const productName = document.getElementById('productName').value;
            formData.append('_subject', `[矩证工作室反馈] ${productName || '新产品'} - ${feedbackType === 'webpage' ? '网页反馈' : feedbackType === 'software' ? '软件反馈' : '其他反馈'}`);
            
            try {
                // 使用AJAX提交到FormSubmit，不跳转页面
                // 邮箱地址经过编码处理，防止直接暴露在源代码中
                const encodedEmail = 'MTU5OTc2OTc5NjlAMTYzLmNvbQ==';
                const email = atob(encodedEmail);
                const response = await fetch('https://formsubmit.co/ajax/' + email, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    // 显示成功卡牌动画
                    showSuccessCard();
                    
                    // 重置表单
                    this.reset();
                    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
                    document.querySelectorAll('.dynamic-section').forEach(s => s.classList.remove('visible'));
                    updateStepIndicator(0);
                } else {
                    throw new Error('提交失败');
                }
            } catch (error) {
                console.error('提交错误:', error);
                showAlert('提交失败，请检查网络后重试', 'error');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // ==================== 开场动画控制 ====================
        window.addEventListener('load', function() {
            const introOverlay = document.getElementById('introOverlay');
            const textOverlay = document.getElementById('textOverlay');
            const texts = [
                document.getElementById('text1'),
                document.getElementById('text2'),
                document.getElementById('text3'),
                document.getElementById('text4')
            ];
            
            // 2.5秒后隐藏开场动画，开始文字动画
            setTimeout(() => {
                introOverlay.classList.add('hidden');
                
                // 开场动画完全结束后显示文字遮罩
                setTimeout(() => {
                    introOverlay.style.display = 'none';
                    textOverlay.classList.add('active');
                    
                    // 依次显示4段文字
                    let delay = 500;
                    texts.forEach((text, index) => {
                        setTimeout(() => {
                            text.classList.add('show');
                        }, delay);
                        delay += 3000; // 每段文字间隔3秒
                    });
                    
                    // 所有文字显示完毕后，隐藏遮罩显示主页面
                    setTimeout(() => {
                        textOverlay.classList.remove('active');
                        setTimeout(() => {
                            textOverlay.style.display = 'none';
                        }, 500);
                    }, delay + 1000);
                    
                }, 800);
            }, 2500);
        });

        // ==================== 成功卡牌动画 ====================
        function showSuccessCard() {
            const overlay = document.getElementById('successCardOverlay');
            const card = document.getElementById('successCard');
            
            // 显示遮罩和卡牌
            overlay.classList.add('show');
            
            // 1秒后自动关闭
            setTimeout(() => {
                card.classList.add('closing');
                
                // 动画结束后隐藏
                setTimeout(() => {
                    overlay.classList.remove('show');
                    card.classList.remove('closing');
                }, 600);
            }, 1500);
        }

        // ==================== 全屏功能 ====================
        function enterFullscreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.mozRequestFullScreen) {
                docElm.mozRequestFullScreen();
            } else if (docElm.webkitRequestFullScreen) {
                docElm.webkitRequestFullScreen();
            } else if (docElm.msRequestFullscreen) {
                docElm.msRequestFullscreen();
            }
        }

        // 页面加载后自动进入全屏（需要用户交互才能触发）
        document.addEventListener('click', function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                enterFullscreen();
            }
        }, { once: true });

        // ==================== 禁用F12和F1 ====================
        document.addEventListener('keydown', function(e) {
            // 禁用F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // 禁用F1
            if (e.key === 'F1' || e.keyCode === 112) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // 禁用Ctrl+Shift+I (Chrome开发者工具)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.keyCode === 73)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // 禁用Ctrl+Shift+J (Chrome控制台)
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.keyCode === 74)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // 禁用Ctrl+U (查看源代码)
            if (e.ctrlKey && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            
            // 禁用Ctrl+S (保存页面)
            if (e.ctrlKey && (e.key === 's' || e.keyCode === 83)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // 检测开发者工具打开（通过窗口大小变化）- 静默处理
        let devToolsOpen = false;
        const threshold = 160;
        
        setInterval(function() {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            
            if ((widthThreshold || heightThreshold) && !devToolsOpen) {
                devToolsOpen = true;
                // 静默处理，不显示任何提示
            } else if (!widthThreshold && !heightThreshold) {
                devToolsOpen = false;
            }
        }, 1000);
    </script>
</body>
</html>
